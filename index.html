<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart AI Bildanalyse – Nemotron</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 2rem;
      background-color: #121212;
      color: #f0f0f0;
    }
    textarea, input[type=file], input[type=text], .question-options {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.75rem;
      background-color: #1e1e1e;
      border: none;
      border-radius: 1rem;
      color: #f0f0f0;
    }
    button {
      padding: 0.75rem 1.5rem;
      background-color: #4a90e2;
      color: white;
      border: none;
      border-radius: 2rem;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:hover {
      background-color: #357ABD;
    }
    .response {
      background-color: #1e1e1e;
      padding: 1.5rem;
      margin-top: 1.5rem;
      border-radius: 1.5rem;
      min-height: 100px;
      white-space: pre-wrap;
    }
    .question-options label {
      display: block;
      margin-top: 0.5rem;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Smart AI Bildanalyse (Nemotron VL)</h1>

  <label>Bild hochladen:</label>
  <input type="file" id="imageUpload" accept="image/*">

  <label>Frage zum Bild:</label>
  <div class="question-options">
    <label><input type="radio" name="questionChoice" value="q1" checked> Essen</label>
    <label><input type="radio" name="questionChoice" value="q2"> Produkt</label>
    <label><input type="radio" name="questionChoice" value="custom"> Eigene Frage eingeben</label>
  </div>

  <!-- Textfeld für eigene Frage (wird nur angezeigt, wenn "Eigene Frage" ausgewählt ist) -->
  <input type="text" id="customQuestion" placeholder="Deine eigene Frage..." style="display:none;">

  <button onclick="analyzeImage()">Analysieren</button>

  <div id="response" class="response"></div>

  <script>
    // Radio-Buttons überwachen, um das Textfeld ein-/auszublenden
    const radioButtons = document.querySelectorAll('input[name="questionChoice"]');
    const customQuestionInput = document.getElementById("customQuestion");

    radioButtons.forEach(rb => {
      rb.addEventListener("change", () => {
        if (rb.value === "custom" && rb.checked) {
          customQuestionInput.style.display = "block";
          customQuestionInput.focus();
        } else {
          customQuestionInput.style.display = "none";
        }
      });
    });

    async function analyzeImage() {
      const fileInput = document.getElementById("imageUpload");
      const responseDiv = document.getElementById("response");

      if (!fileInput.files[0]) {
        alert("Bitte ein Bild auswählen.");
        return;
      }

      // 🔹 Frage basierend auf Auswahl bestimmen
      let questionChoice = document.querySelector('input[name="questionChoice"]:checked').value;
      let question = "";

      if (questionChoice === "q1") {
        question = "deine Antwort soll folgendermaßen aussehen und in keinster weise von den Vorgaben abweichen. In der ersten Zeile das Essen bennenen, nicht in einem Satz, sondern nur den Namen des Essens nennen. In den folgenden Zeilen sollen die Nährwerte des gesamten essens aufaddiert in einer Handelsüblichen Nährwertetabelle angezeigt werden. Die Anwort keine zusätzlichen Informationen oder Wörter enthalten!";
      } else if (questionChoice === "q2") {
        question = "Zähle auf was für Produkte auf dem Bild zu sehen sind und wie viel sie kosten. Beide Teile der Antwort dürfen jeweils nicht mehr als eine Zeile betragen. Damit kann die Antwort insgesamt nicht mehr als eine Zeile Betragen.";
      } else if (questionChoice === "custom") {
        question = customQuestionInput.value.trim();
        if (question === "") {
          question = "Was ist auf dem Bild zu sehen"; // Fallback, falls Feld leer
        }
      }

      responseDiv.textContent = "Analyse läuft …";

      const reader = new FileReader();
      reader.onload = async () => {
        const base64Image = reader.result.split(",")[1];

        try {
          const result = await callNemotron(base64Image, question);
          responseDiv.textContent = result;
        } catch (err) {
          responseDiv.textContent = "Fehler: " + err.message;
        }
      };

      reader.readAsDataURL(fileInput.files[0]);
    }
    
    async function callNemotron(base64Image, question) {
      const res = await fetch("https://nemotron-backend.onrender.com/api/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          image: base64Image,
          question: question
        })
      });

      if (!res.ok) {
        throw new Error("Backend-Fehler");
      }

      const data = await res.json();
      return data.answer || "Keine Antwort erhalten.";
    }
  </script>
</body>
</html>
