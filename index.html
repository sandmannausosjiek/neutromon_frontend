<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart AI Bildanalyse – Nemotron</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 2rem;
      background-color: #121212;
      color: #f0f0f0;
    }
    textarea, input[type=file] {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.75rem;
      background-color: #1e1e1e;
      border: none;
      border-radius: 1rem;
      color: #f0f0f0;
    }
    button {
      padding: 0.75rem 1.5rem;
      background-color: #4a90e2;
      color: white;
      border: none;
      border-radius: 2rem;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:hover {
      background-color: #357ABD;
    }
    .response {
      background-color: #1e1e1e;
      padding: 1.5rem;
      margin-top: 1.5rem;
      border-radius: 1.5rem;
      min-height: 100px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <h1>Smart AI Bildanalyse (Nemotron VL)</h1>

  <label>Bild hochladen:</label>
  <input type="file" id="imageUpload" accept="image/*">

  <label>Frage zum Bild:</label>
  <textarea id="question" rows="4" placeholder="Was ist auf dem Bild zu sehen?"></textarea>

  <button onclick="analyzeImage()">Analysieren</button>

  <div id="response" class="response"></div>

  <script>
    async function analyzeImage() {
      const fileInput = document.getElementById("imageUpload");
      let question = document.getElementById("question").value.trim();
      const responseDiv = document.getElementById("response");

      if (!fileInput.files[0]) {
        alert("Bitte ein Bild auswählen.");
        return;
      }

      // 🔹 Wenn das Frage-Feld leer ist, Standardfrage setzen
      if (question === "") {
        question = "Überprüfe ob Essen auf dem Bild zu sehen ist. wenn Essen zu sehen ist sag mit was für Essen zu sehen ist und nenne mit die ungefähren Nährwerte des Essens insgesamt. Wenn kein Essen auf dem Bild zu sehen ist sag mir was dann zu sehen ist. Wenn es ein gegenstand ist den man online kaufen kann nenne mir einen Preis. gehe nicht auf die fragen ein die wenn die bedignung am anfang nicht erfüllt ist (zB. Essen oder Gegenstand). ignoriere den teil dann einfach. kein es ist kein essen zu sehen oder so in der antwort";
      }

      responseDiv.textContent = "Analyse läuft …";

      const reader = new FileReader();
      reader.onload = async () => {
        const base64Image = reader.result.split(",")[1];

        try {
          const result = await callNemotron(base64Image, question);
          responseDiv.textContent = result;
        } catch (err) {
          responseDiv.textContent = "Fehler: " + err.message;
        }
      };

      reader.readAsDataURL(fileInput.files[0]);
    }
    
    async function callNemotron(base64Image, question) {
      const res = await fetch("https://nemotron-backend.onrender.com/api/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          image: base64Image,
          question: question
        })
      });

      if (!res.ok) {
        throw new Error("Backend-Fehler");
      }

      const data = await res.json();
      return data.answer || "Keine Antwort erhalten.";
    }   
  </script>
</body>
</html>
